name: Java CI Pipeline with Sonar Scan

# Trigger the pipeline on every branch push and pull request activity
on:
  push:
    branches:
      - '**'
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-and-analyze:
    name: Build and Analyze
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download your code onto the GitHub runner machine
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Crucial for SonarQube/SonarCloud to calculate code blame correctly

      # Step 2: Install Java on the GitHub runner machine
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven    # Caches dependencies so subsequent runs take less time

      # Step 3: Cache SonarCloud files to optimize build times
      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # Step 4: Compile, run tests, and execute the Sonar scan
      - name: Build and Analyze with Maven
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Provided automatically by GitHub
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}    # Added by you in GitHub Repository Secrets
        run: >
          mvn -B verify sonar:sonar 
          -Dsonar.projectKey=deepikaskillexchangeapp-prog_skill-exchange-app
          -Dsonar.organization=deepikaskillexchangeapp-prog
          -Dsonar.host.url=https://sonarcloud.io